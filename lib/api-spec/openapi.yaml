        code:
          type: string
        description:
          type: string
        discount_type:
          type: string
        discount_value:
          type: number
        min_order:
          type: ["number", "null"]
        max_uses:
          type: ["integer", "null"]
        uses_count:
          type: integer
        active:
          type: boolean
        expires_at:
          type: ["string", "null"]

    OfferInput:
      type: object
      required: [code, discount_type, discount_value]
      properties:
        code:
          type: string
        description:
          type: string
        discount_type:
          type: string
        discount_value:
          type: number
        min_order:
          type: ["number", "null"]
        max_uses:
          type: ["integer", "null"]
        active:
          type: boolean
        expires_at:
          type: ["string", "null"]

